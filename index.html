<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Non au harcèlement — Enquête école</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#eef2f9;color:#0f172a;
  font-size:16px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
:root{
  --ink:#0f172a; --muted:#5a6478; --line:#dde3ee; --card:#fff;
  --prim:#4338ca; --prim2:#6366f1; --accent:#0ea5e9;
  --vert:#16a34a; --jaune:#e6a100; --orange:#ea580c; --rouge:#dc2626; --rose:#db2777;
  --surv:#f59e0b; --harc:#dc2626;
  --r:18px;
}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:840px;margin:0 auto;padding:18px 16px 34px;flex:1;display:flex;flex-direction:column}
.wrap.narrow{max-width:560px}
.wrap.kid{justify-content:center}
@supports (justify-content: safe center){.wrap.kid{justify-content:safe center}}

/* ---------- BOUTONS ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:58px;padding:14px 22px;border-radius:14px;border:0;
  background:linear-gradient(180deg,#4f46e5,#4338ca);color:#fff;
  font-size:1.06rem;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 6px 16px rgba(67,56,202,.26);
  transition:transform .12s ease, box-shadow .12s ease;
  width:100%;text-align:center;
}
.btn:active{transform:scale(.985);box-shadow:0 3px 10px rgba(67,56,202,.3)}
.btn.gris{background:#fff;color:#243049;border:2px solid var(--line);box-shadow:none}
.btn.mini{min-height:46px;padding:9px 15px;font-size:.9rem;width:auto;border-radius:11px;box-shadow:none}
.btn.rouge{background:linear-gradient(180deg,#ef4444,#dc2626);box-shadow:0 6px 16px rgba(220,38,38,.25)}
.btn.vert{background:linear-gradient(180deg,#22c55e,#16a34a);box-shadow:0 6px 16px rgba(22,163,74,.25)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- ACCUEIL ---------- */
.home{display:flex;flex-direction:column;justify-content:center;flex:1;gap:16px;text-align:center}
.logo{
  width:112px;height:112px;border-radius:32px;margin:0 auto 6px;
  display:flex;align-items:center;justify-content:center;font-size:56px;
  background:linear-gradient(145deg,#eef2ff,#e0e7ff);
  border:2px solid #c7d2fe;
  box-shadow:0 12px 30px rgba(67,56,202,.14);
}
h1{font-size:1.72rem;line-height:1.25;margin:0;letter-spacing:-.4px;font-weight:800}
.sub{color:var(--muted);font-size:1rem;margin:0}
.pill{display:inline-block;background:#e0e7ff;color:#3730a3;font-size:.76rem;font-weight:800;
  padding:5px 12px;border-radius:999px;letter-spacing:.6px;text-transform:uppercase}
.home .btn{margin-top:6px}

/* ---------- CARTE GENERALE ---------- */
.card{background:var(--card);border-radius:var(--r);padding:22px 20px;
  box-shadow:0 4px 18px rgba(15,23,42,.06);border:1px solid #e8ecf5;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1.18rem;letter-spacing:-.2px}
.card h3{margin:18px 0 8px;font-size:1rem;color:#334155}
.card p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.tiny{font-size:.78rem}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------- IDENTITE ---------- */
.grp{margin-bottom:20px}
.grp>label{display:block;font-weight:800;font-size:1rem;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  flex:1 1 auto;min-width:84px;min-height:56px;padding:10px 14px;border-radius:13px;
  background:#f6f8fd;border:2px solid var(--line);color:#334155;font-family:inherit;
  font-size:1rem;font-weight:700;cursor:pointer;transition:.13s;
}
.chip:active{transform:scale(.97)}
.chip.on{background:#eef2ff;border-color:var(--prim);color:#3730a3;box-shadow:0 0 0 3px rgba(67,56,202,.12)}

/* ---------- QUESTION ---------- */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .lab{font-size:.82rem;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.pbar{flex:1;height:9px;background:#e2e8f4;border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6366f1,#0ea5e9);border-radius:99px;transition:width .3s ease}
.qico{
  width:78px;height:78px;border-radius:24px;display:flex;align-items:center;justify-content:center;
  font-size:38px;background:linear-gradient(145deg,#eef2ff,#e0e7ff);border:2px solid #c7d2fe;
  margin-bottom:14px;
}
.qtxt{font-size:1.42rem;line-height:1.42;font-weight:700;margin:0 0 14px;letter-spacing:-.3px}
.qsim{background:#f4f7fd;border-left:5px solid #a5b4fc;border-radius:0 12px 12px 0;
  padding:11px 14px;font-size:1rem;color:#3d4a63;margin-bottom:20px;line-height:1.5}
.qsim b{color:#4338ca}
.audio{display:inline-flex;align-items:center;gap:8px;background:#eef2ff;color:#3730a3;border:0;
  font-family:inherit;font-size:.9rem;font-weight:800;padding:9px 15px;border-radius:999px;
  cursor:pointer;margin-bottom:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{
  border:2px solid var(--line);background:#fff;border-radius:17px;padding:14px 10px;
  min-height:104px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;transition:.12s;
}
.opt .em{font-size:31px;line-height:1}
.opt .lb{font-size:1.02rem;font-weight:800;color:#1e293b}
.opt .nv{font-size:.72rem;font-weight:800;color:#94a3b8;letter-spacing:.5px}
.opt:active{transform:scale(.976)}
.opt.o1{background:#f4fdf7;border-color:#a7f3c4}
.opt.o2{background:#fffdf2;border-color:#fce08a}
.opt.o3{background:#fff9f2;border-color:#fbbf80}
.opt.o4{background:#fff5f5;border-color:#f9a8a8}
.opt.sel{box-shadow:0 0 0 4px rgba(67,58,202,.18);border-color:var(--prim)}
.qfoot{display:flex;gap:10px;margin-top:18px;align-items:center;justify-content:space-between}
.lnk{background:none;border:0;font-family:inherit;font-size:.9rem;color:#64748b;text-decoration:underline;
  padding:10px;cursor:pointer}

/* ---------- OUI / NON ---------- */
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.yn{min-height:82px;border-radius:16px;border:2px solid var(--line);background:#fff;font-family:inherit;
  font-size:1.1rem;font-weight:800;cursor:pointer;color:#1e293b}
.yn.on{background:#eef2ff;border-color:var(--prim);color:#3730a3}

/* ---------- MERCI ---------- */
.bigok{width:104px;height:104px;border-radius:50%;background:#dcfce7;border:3px solid #86efac;
  display:flex;align-items:center;justify-content:center;font-size:52px;margin:0 auto 16px}
.num3618{display:flex;align-items:center;gap:14px;background:#fff7ed;border:2px solid #fed7aa;
  border-radius:15px;padding:14px 16px;margin:14px 0}
.num3618 .n{font-size:1.7rem;font-weight:900;color:#c2410c;letter-spacing:.5px}

/* ---------- ESPACE ADULTE ---------- */
.adm{background:#f7f9fd;flex:1}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:3px 0 12px;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;border:2px solid var(--line);background:#fff;border-radius:11px;
  padding:9px 14px;font-family:inherit;font-size:.86rem;font-weight:800;color:#475569;cursor:pointer}
.tab.on{background:#4338ca;color:#fff;border-color:#4338ca}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-bottom:14px}
.kpi{background:#fff;border-radius:15px;padding:15px 16px;border:1px solid #e8ecf5;
  box-shadow:0 3px 12px rgba(15,23,42,.05)}
.kpi .v{font-size:2rem;font-weight:900;line-height:1.1;letter-spacing:-1px}
.kpi .l{font-size:.79rem;color:var(--muted);font-weight:700;margin-top:3px;line-height:1.35}
.kpi.h{border-left:5px solid var(--harc)}.kpi.h .v{color:var(--harc)}
.kpi.s{border-left:5px solid var(--surv)}.kpi.s .v{color:#b45309}
.kpi.g{border-left:5px solid var(--vert)}.kpi.g .v{color:var(--vert)}
.kpi.p{border-left:5px solid var(--prim)}.kpi.p .v{color:var(--prim)}
.kpi.n{border-left:5px solid #94a3b8}.kpi.n .v{color:#475569}

table{width:100%;border-collapse:collapse;font-size:.88rem;background:#fff}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid #eef1f7}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.4px;color:#64748b;font-weight:800;
  background:#f8fafc;border-bottom:2px solid #e2e8f0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{white-space:nowrap}
tr.tot td{font-weight:800;background:#f8fafc;border-top:2px solid #e2e8f0}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid #e8ecf5}

.bars{display:flex;flex-direction:column;gap:11px}
.bar .lb{display:flex;align-items:baseline;gap:8px;font-size:.87rem;margin-bottom:4px;color:#1e293b;line-height:1.35}
.bar .qn{font-size:.68rem;font-weight:900;color:#fff;background:#818cf8;border-radius:5px;
  padding:1px 5px;flex:0 0 auto;letter-spacing:.3px}
.bar .lb .sp{flex:1 1 auto}
.bar .p{font-weight:900;font-variant-numeric:tabular-nums;flex:0 0 auto;color:#334155}
.bar .t{background:#eef2f7;border-radius:99px;height:11px;overflow:hidden}
.bar .t>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#818cf8,#4338ca)}
.bar .t>i.vide{background:#eef2f7}

.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:900;letter-spacing:.3px}
.b-h{background:#fee2e2;color:#991b1b}
.b-s{background:#fef3c7;color:#92400e}
.b-r{background:#dcfce7;color:#166534}
.b-n{background:#e2e8f0;color:#475569}

.alerte{background:#fef2f2;border:2px solid #fecaca;border-left:6px solid var(--rouge);
  border-radius:14px;padding:14px 16px;margin-bottom:14px}
.alerte h3{margin:0 0 6px;color:#991b1b;font-size:1rem}
.alerte p{margin:0;font-size:.9rem;color:#7f1d1d}
.info{background:#eff6ff;border:2px solid #bfdbfe;border-left:6px solid #2563eb;
  border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:.9rem;color:#1e3a8a}
.warn{background:#fffbeb;border:2px solid #fde68a;border-left:6px solid var(--jaune);
  border-radius:14px;padding:13px 15px;margin-bottom:14px;font-size:.9rem;color:#78350f}
.okbox{background:#f0fdf4;border:2px solid #bbf7d0;border-left:6px solid var(--vert);
  border-radius:14px;padding:13px 15px;margin-bottom:14px;font-size:.9rem;color:#14532d}

.comp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 4px}
.comp .c{background:#f8fafc;border-radius:13px;padding:13px;text-align:center;border:1px solid #e8ecf5}
.comp .c .v{font-size:1.7rem;font-weight:900}
.comp .c .l{font-size:.76rem;color:var(--muted);font-weight:700}

.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:300px;margin:16px auto 0}
.pinpad button{height:64px;border-radius:15px;border:2px solid var(--line);background:#fff;
  font-family:inherit;font-size:1.4rem;font-weight:800;color:#1e293b;cursor:pointer}
.pinpad button:active{background:#eef2ff}
.dots{display:flex;gap:11px;justify-content:center;margin:14px 0}
.dots i{width:15px;height:15px;border-radius:50%;background:#dbe2ee;display:block}
.dots i.on{background:#4338ca}

/* ---------- SAISIE ENSEIGNANT ---------- */
.sais{background:#fff;border-radius:14px;border:1px solid #e8ecf5;box-shadow:0 4px 18px rgba(15,23,42,.06);overflow:hidden}
.shead{padding:11px 14px;background:linear-gradient(180deg,#eef2ff,#e7edff);border-bottom:1px solid #dbe3f5}
.shead .t{font-weight:900;font-size:1rem;color:#312e81}
.shead .s{font-size:.79rem;color:#4b5563;margin-top:1px}
.sid{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #eef1f7;align-items:center}
.sx{min-height:36px;padding:4px 12px;border-radius:9px;border:2px solid #dde3ee;background:#fff;
  font-family:inherit;font-weight:700;font-size:.82rem;cursor:pointer;color:#475569}
.sx.on{background:#eef2ff;border-color:#4338ca;color:#3730a3}
.sid select{min-height:36px;border:2px solid #dde3ee;border-radius:9px;font-family:inherit;
  font-size:.82rem;padding:4px 8px;color:#1e293b;background:#fff;flex:0 1 132px}
.sid input{min-height:36px;border:2px solid #dde3ee;border-radius:9px;font-family:inherit;
  font-size:.82rem;padding:4px 8px;color:#1e293b;background:#fff;flex:1 1 150px;min-width:110px}
.srow{display:grid;grid-template-columns:28px 1fr 152px;gap:8px;align-items:center;
  padding:3px 12px;border-bottom:1px solid #f1f4f9}
.srow.cur{background:#eef2ff;box-shadow:inset 3px 0 0 #4338ca}
.srow .sn{font-size:.7rem;font-weight:900;color:#94a3b8;text-align:right}
.srow .st{font-size:.85rem;color:#1e293b;line-height:1.2;padding:4px 0}
.srow .sv{display:flex;gap:5px;justify-content:flex-end}
.sbn{width:31px;height:31px;border-radius:7px;border:2px solid #dde3ee;background:#fff;font-family:inherit;
  font-weight:900;font-size:.78rem;color:#94a3b8;cursor:pointer;transition:.1s}
.sbn.w{width:auto;padding:0 9px;font-size:.76rem}
.sbn.sel1{background:#dcfce7;border-color:#22c55e;color:#15803d}
.sbn.sel2{background:#fef9c3;border-color:#eab308;color:#a16207}
.sbn.sel3{background:#ffedd5;border-color:#f97316;color:#c2410c}
.sbn.sel4{background:#fee2e2;border-color:#ef4444;color:#b91c1c}
.sbn.selo{background:#dbeafe;border-color:#3b82f6;color:#1d4ed8}
.sbar{position:sticky;bottom:0;background:#fff;border-top:2px solid #dde3ee;padding:9px 12px;
  display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,24px);background:#0f172a;color:#fff;
  padding:11px 18px;border-radius:12px;font-size:.88rem;font-weight:700;opacity:0;pointer-events:none;
  transition:.25s;z-index:99;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){
  .srow{grid-template-columns:24px 1fr 122px;padding:3px 8px}
  .sbn{width:27px;height:27px;font-size:.72rem}
  .sbn.w{padding:0 6px;font-size:.7rem}
  .srow .st{font-size:.78rem}
}

@media (min-width:760px){.tabs{flex-wrap:wrap;overflow:visible}}

/* ---------- IMPRESSION ---------- */
@media print{
  @page{size:A4;margin:12mm 12mm}
  body{background:#fff;font-size:10.5pt}
  .noprint,.tabs,.btn,.tab{display:none!important}
  #app{display:block}
  .wrap{max-width:none;padding:0}
  .card{box-shadow:none;border:0;border-radius:0;break-inside:auto;margin:0 0 13px;padding:0}
  .card+.card{border-top:1px solid #e2e8f0;padding-top:11px}
  h2,h3{break-after:avoid}
  .kpis,.tbl,table,.bar,.alert,.alerte,.info,.warn,.okbox{break-inside:avoid}
  .kpis{grid-template-columns:repeat(4,1fr);gap:7px}
  .kpi{box-shadow:none;border:1px solid #d5dbe6}
  .page{break-after:page}
  .tbl{overflow:visible;border:0}
  table{font-size:9pt}
  th,td{padding:4px 5px}
  .bars{gap:5px}
  .bar .t{height:18px}.bar .t>span{line-height:18px;font-size:7.5pt}
  h1{font-size:15pt}
  .prp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
    border-bottom:3px solid #4338ca;padding-bottom:10px;margin-bottom:12px}
  .prp-head .t{font-size:16pt;font-weight:900;line-height:1.2;margin:0}
  .prp-head .s{font-size:9pt;color:#475569;margin:3px 0 0}
  a{color:inherit;text-decoration:none}
  .no-print-only{display:none!important}
}

/* ---------- MOBILE ---------- */
@media (max-width:520px){
  .wrap{padding:12px 12px 26px}
  h1{font-size:1.45rem}
  .qtxt{font-size:1.22rem}
  .qsim{font-size:.94rem}
  .opt{min-height:96px}
  .opt .em{font-size:27px}
  .opt .lb{font-size:.95rem}
  .logo{width:96px;height:96px;font-size:48px;border-radius:28px}
  .kpi .v{font-size:1.65rem}
  .comp{grid-template-columns:1fr}
  .card{padding:17px 15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
